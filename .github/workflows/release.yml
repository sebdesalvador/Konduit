name: Release

# Publishing to nuget.org is permanent: a version can never be deleted, only
# unlisted, and the package name is claimed for good. This workflow therefore
# runs only from an explicit tag or a manual dispatch, and is gated on the
# "nuget" environment so required reviewers can be added in repository settings.
#
# Authentication uses NuGet trusted publishing: the job proves its identity to
# nuget.org with a GitHub OIDC token and receives an API key that expires in
# minutes, so there is no long-lived secret to leak or rotate. The trusted
# publisher policy on nuget.org must name this repository, this workflow file
# (release.yml) and the "nuget" environment, or the exchange is refused.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without a leading v (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to nuget.org
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a valid semantic version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"

      - name: Build
        run: dotnet build --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: >
          dotnet pack src/Konduit/Konduit.csproj
          --no-build --configuration Release
          -p:Version=${{ steps.version.outputs.version }}
          --output artifacts/packages

      # Fail here rather than after publishing: a bad package cannot be taken back.
      - name: Verify the generator is in the package
        run: |
          set -euo pipefail
          package=$(ls artifacts/packages/Konduit.*.nupkg)
          unzip -l "$package" | grep -q 'analyzers/dotnet/cs/Konduit.SourceGeneration.dll'
          unzip -l "$package" | grep -q 'lib/net8.0/Konduit.dll'
          unzip -l "$package" | grep -q 'lib/net10.0/Konduit.dll'
          echo "Package layout is correct."

      - name: Check the NuGet account is configured
        run: |
          if [ -z "${{ vars.NUGET_USER }}" ]; then
            echo "::error::Repository variable NUGET_USER is not set. Set it to your nuget.org username with: gh variable set NUGET_USER" >&2
            exit 1
          fi

      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # The symbol package next to the .nupkg is pushed automatically by the client.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Create GitHub release
        if: github.event_name == 'push'
        run: gh release create "${GITHUB_REF_NAME}" artifacts/packages/*.nupkg --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
