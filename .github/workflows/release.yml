name: Release

# Publishing to nuget.org is permanent: a version can never be deleted, only
# unlisted, and the package name is claimed for good. This workflow therefore
# runs only from an explicit tag or a manual dispatch, and is gated on the
# "nuget" environment so required reviewers can be added in repository settings.
#
# Authentication uses NuGet trusted publishing: the job proves its identity to
# nuget.org with a GitHub OIDC token and receives an API key that expires in
# minutes, so there is no long-lived secret to leak or rotate. The trusted
# publisher policy on nuget.org must name this repository, this workflow file
# (release.yml) and the "nuget" environment, or the exchange is refused.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without a leading v (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to nuget.org
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a valid semantic version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"

      - name: Build
        run: dotnet build --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: |
          dotnet pack src/Konduit/Konduit.csproj \
            --no-build --configuration Release \
            -p:Version=${{ steps.version.outputs.version }} \
            --output artifacts/packages
          dotnet pack src/Konduit.MediatR/Konduit.MediatR.csproj \
            --no-build --configuration Release \
            -p:Version=${{ steps.version.outputs.version }} \
            --output artifacts/packages

      # Fail here rather than after publishing: a bad package cannot be taken back.
      - name: Verify the package layouts
        run: |
          set -euo pipefail

          core=$(ls artifacts/packages/Konduit.[0-9]*.nupkg)
          unzip -l "$core" | grep -q 'analyzers/dotnet/cs/Konduit.SourceGeneration.dll'
          unzip -l "$core" | grep -q 'lib/net8.0/Konduit.dll'
          unzip -l "$core" | grep -q 'lib/net10.0/Konduit.dll'

          mediatr=$(ls artifacts/packages/Konduit.MediatR.*.nupkg)
          unzip -l "$mediatr" | grep -q 'lib/net8.0/Konduit.MediatR.dll'
          unzip -l "$mediatr" | grep -q 'lib/net10.0/Konduit.MediatR.dll'

          echo "Package layouts are correct."

      # NUGET_USER is the nuget.org account that CREATED the trusted publisher
      # policy, which is not necessarily the account that owns the package.
      - name: Check the NuGet account is configured
        run: |
          user="${{ vars.NUGET_USER }}"
          if [ -z "$user" ] || [ "$user" = "your-nuget-username" ]; then
            echo "::error::Repository variable NUGET_USER is unset or still the placeholder. Set it to the nuget.org username that created the trusted publisher policy: gh variable set NUGET_USER --body '<username>'" >&2
            exit 1
          fi

      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushed one at a time, newest package first, rather than by glob.
      #
      # A publish cannot be undone, so the ordering is deliberate: a glob pushes alphabetically,
      # which would publish Konduit before Konduit.MediatR and leave a half-released version behind
      # if the second push were rejected — for instance by a trusted publisher glob that does not
      # cover the newer package. Pushing the less proven package first means such a failure happens
      # before anything is published.
      #
      # The symbol package next to each .nupkg is pushed automatically by the client.
      - name: Push to nuget.org
        run: |
          set -euo pipefail
          for package in \
            artifacts/packages/Konduit.MediatR.*.nupkg \
            artifacts/packages/Konduit.[0-9]*.nupkg
          do
            echo "Pushing $package"
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done

      - name: Create GitHub release
        if: github.event_name == 'push'
        run: gh release create "${GITHUB_REF_NAME}" artifacts/packages/*.nupkg --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
